tr><td>怎么查<\/td><td>`nm -C foo.o \\<\/td><td>grep foo`（看是否 Undefined）、检查命令里有没有那个文件/库<\/td><td>报错会给<strong>两个文件的行号<\/strong>，直接看那两个位置<\/td><\/tr><\/tbody><\/table>\n<p><strong>最容易踩的那个<\/strong>：头文件里写<\/p>\n<pre><code class=\"lang-c\">int g_count;          /* 错：这是定义，每个 include 它的 .c 都会生成一份 */<\/code><\/pre>\n<p>改成<\/p>\n<pre><code class=\"lang-c\">extern int g_count;   /* 对：这是声明 */<\/code><\/pre>\n<p>然后在<strong>某一个<\/strong> <code>.c<\/code> 里写 <code>int g_count = 0;<\/code>。<\/p>\n<p><strong>一句话区分<\/strong>：<br><code>undefined<\/code> 是「<strong>少<\/strong>了定义」，<code>multiple<\/code> 是「<strong>多<\/strong>了定义」。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>一句话区分少/多。<\/li>\n<li>各说出至少两个原因。<\/li>\n<li>知道「头文件里放定义」是 multiple 的头号来源。<\/li>\n<\/ol>"}, {"id": "C07", "module": "编译", "chapter": "5 多文件工程", "topic": "5.1 头文件里该放什么", "outline_ref": "5.1", "qtype": "short", "stage_label": "常见错误", "difficulty": 2, "plain": "头文件里应该放什么、不该放什么？ 为什么在 foo.h 里写一句 int g count; 会导致链接错误？正确写法是什么？", "stem_html": "<p><strong>头文件里应该放什么、不该放什么？<\/strong><\/p>\n<p>为什么在 <code>foo.h<\/code> 里写一句 <code>int g_count;<\/code> 会导致链接错误？正确写法是什么？<\/p>", "answer_html": "<p><strong>该放（声明类）<\/strong><\/p>\n<ul>\n<li>函数声明（原型）<\/li>\n<li><code>extern<\/code> 变量声明<\/li>\n<li>宏、<code>typedef<\/code>、结构体/枚举的<strong>类型定义<\/strong><\/li>\n<li><code>static inline<\/code> 函数（每个翻译单元一份，合法）<\/li>\n<\/ul>\n<p><strong>不该放（定义类）<\/strong><\/p>\n<ul>\n<li>变量定义 <code>int g_count;<\/code><\/li>\n<li>普通函数定义 <code>void f(void) { ... }<\/code><\/li>\n<li>会分配存储或用初始化的东西<\/li>\n<\/ul>\n<p><strong>为什么会炸<\/strong>：<br>头文件是<strong>文本插入<\/strong>。<code>a.c<\/code> 和 <code>b.c<\/code> 都 <code>#include \"foo.h\"<\/code>，预处理后两个编译单元里各有一份 <code>int g_count;<\/code> 的<strong>定义<\/strong>，<br>链接时符号表里出现两个 <code>g_count<\/code> → <code>multiple definition<\/code>。<\/p>\n<p><strong>正确写法<\/strong><\/p>\n<pre><code class=\"lang-c\">/* foo.h */\nextern int g_count;        /* 声明：只是告诉编译器&quot;有这么个东西&quot; */\n\n/* foo.c */\nint g_count = 0;           /* 定义：整个程序只有这一处 */<\/code><\/pre>\n<p><strong>一个补充<\/strong>：C99 之后可以用 <code>static const<\/code> 放常量在头文件里（每个 .c 各一份副本，不冲突）；<br>但<strong>不要<\/strong>在头文件里写 <code>const int N = 10;<\/code> 又指望它只有一份——那在 C 里仍然是定义。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>分清「声明」和「定义」。<\/li>\n<li>说清 include 是文本插入 → 每个 .c 各一份定义。<\/li>\n<li>给出 <code>extern<\/code> + 一个 .c 定义的正确写法。<\/li>\n<\/ol>"}, {"id": "C08", "module": "编译", "chapter": "4 链接", "topic": "4.4 静态库与动态库", "outline_ref": "4.4", "qtype": "short", "stage_label": "常见错误", "difficulty": 3, "plain": "三个问题： 1. 目录里同时有 libfoo.a 和 libfoo.so ， gcc main.c L. lfoo o app 会选哪个？ 2. 想强制用静态库，怎么写？ 3. 程…", "stem_html": "<p><strong>三个问题：<\/strong><\/p>\n<ol>\n<li>目录里同时有 <code>libfoo.a<\/code> 和 <code>libfoo.so<\/code>，<code>gcc main.c -L. -lfoo -o app<\/code> 会选哪个？<\/li>\n<li>想强制用静态库，怎么写？<\/li>\n<li>程序编译通过了，运行时却报 <code>error while loading shared libraries: libfoo.so: cannot open shared object file<\/code>，是什么原因？怎么解决？<\/li>\n<\/ol>", "answer_html": "<p><strong>1. 默认选动态库 <code>.so<\/code>。<\/strong><\/p>\n<p><code>-lfoo<\/code> 的搜索顺序是：先找 <code>libfoo.so<\/code>，找不到才退回 <code>libfoo.a<\/code>。<\/p>\n<p><strong>2. 强制静态，两种写法：<\/strong><\/p>\n<pre><code class=\"lang-bash\">gcc main.c -L. -Wl,-Bstatic -lfoo -Wl,-Bdynamic -o app   # 对这一小段强制静态\ngcc main.c ./libfoo.a -o app                              # 直接给 .a 的路径，最直白<\/code><\/pre>\n<p><strong>3. 编译过、运行挂 —— 这是典型的「动态库找不到」不是「链接失败」。<\/strong><\/p>\n<p>原因：<code>.so<\/code> 的路径<strong>没写进可执行文件<\/strong>，运行时加载器按 <code>LD_LIBRARY_PATH<\/code>、<code>/etc/ld.so.conf<\/code>、<code>/lib<\/code>、<code>/usr/lib<\/code> 去找，都找不到。<\/p>\n<p>四种解决办法：<\/p>\n<table><thead><tr><th>办法<\/th><th>命令<\/th><\/tr><\/thead><tbody><tr><td>临时指定路径<\/td><td><code>LD_LIBRARY_PATH=$PWD ./app<\/code><\/td><\/tr><tr><td>把路径烧进二进制<\/td><td><code>gcc ... -Wl,-rpath,'$ORIGIN'<\/code><\/td><\/tr><tr><td>注册到系统<\/td><td>把目录写进 <code>/etc/ld.so.conf.d/<\/code>，再 <code>ldconfig<\/code><\/td><\/tr><tr><td>干脆静态链接<\/td><td>用第 2 问的办法<\/td><\/tr><\/tbody><\/table>\n<p><strong>查看它到底依赖什么<\/strong>：<code>ldd ./app<\/code>。<\/p>\n<p><strong>静态 vs 动态一句话<\/strong>：静态库在链接时<strong>抄进<\/strong>可执行文件（体积大、部署简单）；<br>动态库运行时才加载（体积小、可共享、但要管路径）。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说对「<code>-l<\/code> 优先 <code>.so<\/code>」。<\/li>\n<li>给出至少一种强制静态的写法。<\/li>\n<li>分清「链接期找不到」和「运行期找不到」，并给出 rpath / LD_LIBRARY_PATH 这类解法。<\/li>\n<\/ol>"}, {"id": "M01", "module": "内存", "chapter": "1 程序内存的几大部分", "topic": "1.1-1.7 五个区与变量归属", "outline_ref": "1.1-1.7", "qtype": "short", "stage_label": "概念", "difficulty": 2, "plain": "程序内存分为哪几部分？ 再说清楚：编译器是 根据什么 决定一个变量放哪一段的？（不要只背「栈放局部变量」，说判据）", "stem_html": "<p><strong>程序内存分为哪几部分？<\/strong><\/p>\n<p>再说清楚：编译器是<strong>根据什么<\/strong>决定一个变量放哪一段的？（不要只背「栈放局部变量」，说判据）<\/p>", "answer_html": "<table><thead><tr><th>区<\/th><th>放什么<\/th><th>何时分配/释放<\/th><th>可写<\/th><\/tr><\/thead><tbody><tr><td>栈<\/td><td>局部变量、参数、返回地址<\/td><td>进出函数自动<\/td><td>可写<\/td><\/tr><tr><td>堆<\/td><td><code>malloc<\/code> 系<\/td><td>手动 free<\/td><td>可写<\/td><\/tr><tr><td><code>.bss<\/code><\/td><td>未初始化（或初始化为 0）的全局/静态<\/td><td>程序启动时清零<\/td><td>可写<\/td><\/tr><tr><td><code>.data<\/code><\/td><td>已初始化（非 0）的全局/静态<\/td><td>程序启动时装载<\/td><td>可写<\/td><\/tr><tr><td><code>.rodata<\/code><\/td><td>字符串字面量、<code>const<\/code> 全局量<\/td><td>程序启动时装载<\/td><td><strong>只读<\/strong><\/td><\/tr><tr><td><code>.text<\/code><\/td><td>机器指令<\/td><td>程序启动时装载<\/td><td>只读可执行<\/td><\/tr><\/tbody><\/table>\n<p><strong>判据其实就两条<\/strong>：<\/p>\n<ol>\n<li><strong>作用域/生命周期<\/strong>：函数内部的自动变量 → 栈；整个程序活着 → <code>.data/.bss<\/code>；手动管 → 堆。<\/li>\n<li><strong>有没有初值、初值是不是 0<\/strong>：全局/静态变量有非 0 初值 → <code>.data<\/code>；没写初值或写 0 → <code>.bss<\/code>。<\/li>\n<\/ol>\n<p><strong>所以：<\/strong><\/p>\n<ul>\n<li><code>static int x = 5;<\/code> 在函数里，也在 <code>.data<\/code>（生命周期是全程序，不随函数退出消失）<\/li>\n<li><code>const char *p = \"abc\";<\/code> 拆成两半：指针 <code>p<\/code> 在 <code>.data<\/code>，<code>\"abc\"<\/code> 在 <code>.rodata<\/code><\/li>\n<\/ul>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>五区齐全，各自放什么说对。<\/li>\n<li>说出「有没有非 0 初值」决定 <code>.data<\/code> 还是 <code>.bss<\/code>。<\/li>\n<li>函数里的 <code>static<\/code> 不在栈上。<\/li>\n<\/ol>"}, {"id": "M02", "module": "内存", "chapter": "1 程序内存的几大部分", "topic": "1.6-1.7 段与可执行文件体积", "outline_ref": "1.6-1.7", "qtype": "code_read", "stage_label": "代码用法", "difficulty": 3, "plain": "这两份代码编译出来的可执行文件，大小差多少？为什么？", "stem_html": "<p><strong>这两份代码编译出来的可执行文件，大小差多少？为什么？<\/strong><\/p>\n<pre><code class=\"lang-c\">/* A.c */\nchar big_a[1024 * 1024] = {1};\nint main(void) { return big_a[0]; }<\/code><\/pre>\n<pre><code class=\"lang-c\">/* B.c */\nchar big_b[1024 * 1024];\nint main(void) { return big_b[0]; }<\/code><\/pre>", "answer_html": "<p><strong>A 的文件比 B 大约 1 MB。<\/strong><\/p>\n<ul>\n<li><code>big_a<\/code> 有非 0 初值（<code>{1}<\/code> 意味着第一个字节是 1）→ 落在 <strong><code>.data<\/code><\/strong>，<strong>初值必须存在可执行文件里<\/strong>，加载时拷进内存。<\/li>\n<li><code>big_b<\/code> 没有初值 → 落在 <strong><code>.bss<\/code><\/strong>，可执行文件里<strong>只记一条「这块要 1MB、启动时清零」的记录<\/strong>，不占文件体积。<\/li>\n<\/ul>\n<p><strong>一句话<\/strong>：<code>.bss<\/code> 省的是<strong>磁盘/Flash 空间<\/strong>，不省 RAM——运行时两者都要占 1MB。<\/p>\n<p><strong>嵌入式里的意义<\/strong>：<br>Flash 小、RAM 更小的 MCU 上，「大数组不初始化」能把固件体积压下来；<br>但要清楚它照样吃 RAM，RAM 不够一样跑不起来。<\/p>\n<p><strong>验证方法<\/strong>：<br><code>size a.out<\/code> 会打印 <code>text data bss<\/code> 三段大小，直接看 <code>bss<\/code> 那一列。<\/p>\n<p><strong>追问<\/strong>：<code>char big[1024*1024] = {0};<\/code> 算 <code>.data<\/code> 还是 <code>.bss<\/code>？<br>→ 全 0 初始化，编译器一般也归到 <code>.bss<\/code>（标准只要求行为一致，实现通常这么做）。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>答出 A 比 B 大约 1MB。<\/li>\n<li>说清 <code>.data<\/code> 初值要写进文件、<code>.bss<\/code> 只占运行时。<\/li>\n<li>知道用 <code>size<\/code> 命令验证。<\/li>\n<\/ol>"}, {"id": "M03", "module": "内存", "chapter": "2 内存对齐", "topic": "2.1-2.2 对齐规则与结构体 padding", "outline_ref": "2.1-2.2", "qtype": "short", "stage_label": "概念", "difficulty": 3, "plain": "内存对齐是怎么回事？ 用这条规则算一下： struct S { char a; int b; short c; }; 在 32 位/64 位 x86 上 sizeof(struct…", "stem_html": "<p><strong>内存对齐是怎么回事？<\/strong><\/p>\n<p>用这条规则算一下：<code>struct S { char a; int b; short c; };<\/code> 在 32 位/64 位 x86 上 <code>sizeof(struct S)<\/code> 是多少？把 padding 画出来。<\/p>", "answer_html": "<p><strong>为什么对齐<\/strong>：CPU 访问内存是按「总线宽度」成块读的。4 字节的 <code>int<\/code> 如果跨在两个 4 字节块上，要么多读一次，要么直接硬件异常（ARM 某些配置就是这样）。所以编译器把每个成员放到「自己大小的整数倍」地址上，中间填 padding。<\/p>\n<p><strong>规则（x86-64 / 常见 ARM ABI）<\/strong><\/p>\n<ol>\n<li>每个成员的偏移量 = 它自身大小的整数倍<\/li>\n<li>结构体总大小 = 最大成员大小的整数倍（末尾补 padding）<\/li>\n<li><code>#pragma pack(n)<\/code> / <code>__attribute__((packed))<\/code> 可以打破规则 1、2<\/li>\n<\/ol>\n<p><strong>算 <code>struct S<\/code><\/strong><\/p>\n<table><thead><tr><th>成员<\/th><th>大小<\/th><th>偏移<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><code>a<\/code><\/td><td>1<\/td><td>0<\/td><td><\/td><\/tr><tr><td><em>padding<\/em><\/td><td>3<\/td><td>1–3<\/td><td>为了让 <code>b<\/code> 从 4 开始<\/td><\/tr><tr><td><code>b<\/code><\/td><td>4<\/td><td>4–7<\/td><td><\/td><\/tr><tr><td><code>c<\/code><\/td><td>2<\/td><td>8–9<\/td><td><\/td><\/tr><tr><td><em>padding<\/em><\/td><td>2<\/td><td>10–11<\/td><td>总大小要对齐到 4（最大成员是 int）<\/td><\/tr><tr><td><strong>合计<\/strong><\/td><td><strong>12<\/strong><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table>\n<p><strong>所以 <code>sizeof(struct S) == 12<\/code>，不是 1+4+2=7。<\/strong><\/p>\n<p><strong>如果把成员顺序换一下<\/strong>：<code>int b; short c; char a;<\/code> → 4+2+1+1(padding) = <strong>8<\/strong>。<br><strong>顺序会影响大小<\/strong>，这也是\"把大的放前面\"这条建议的由来。<\/p>\n<p><strong><code>#pragma pack(1)<\/code> 之后<\/strong>变成 7（不补 padding），但访问 <code>b<\/code> 时可能触发未对齐访问的代价（x86 上慢，部分 ARM 上直接 fault）。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>算出 12，并画出 3 字节和 2 字节的 padding。<\/li>\n<li>说出两条对齐规则。<\/li>\n<li>知道成员顺序会改变总大小。<\/li>\n<\/ol>"}, {"id": "M04", "module": "内存", "chapter": "2 内存对齐", "topic": "2.3 #pragma pack 与 packed", "outline_ref": "2.3", "qtype": "code_read", "stage_label": "代码用法", "difficulty": 3, "plain": "三段代码分别输出什么？ 分别 printf(\"%zu\", sizeof(struct A/B/C)) 。", "stem_html": "<p><strong>三段代码分别输出什么？<\/strong><\/p>\n<pre><code class=\"lang-c\">struct A { char a; int b; short c; };          /* ① */\n#pragma pack(1)\nstruct B { char a; int b; short c; };          /* ② */\n#pragma pack()\nstruct C { char a; int b; short c; };          /* ③ */<\/code><\/pre>\n<p>分别 <code>printf(\"%zu\", sizeof(struct A/B/C))<\/code>。<\/p>", "answer_html": "<pre><code>① 12\n② 7\n③ 12<\/code><\/pre>\n<ul>\n<li><strong>①<\/strong> 默认对齐：<code>char<\/code>(1) + pad(3) + <code>int<\/code>(4) + <code>short<\/code>(2) + pad(2) = 12<\/li>\n<li><strong>②<\/strong> <code>#pragma pack(1)<\/code> 之后每个成员紧挨着：1 + 4 + 2 = <strong>7<\/strong>，没有任何 padding<\/li>\n<li><strong>③<\/strong> <code>#pragma pack()<\/code> 恢复默认，所以又回到 12<\/li>\n<\/ul>\n<p><strong><code>packed<\/code> 的代价（面试常追问）<\/strong><\/p>\n<ol>\n<li><strong>性能<\/strong>：成员地址可能不是自然对齐，x86 上访问变慢；ARMv7 默认对非对齐访问直接触发异常（除非开了 unaligned access）。<\/li>\n<li><strong>不可移植<\/strong>：不同编译器/架构对 <code>packed<\/code> 的细节不完全一致。<\/li>\n<li><strong>取地址风险<\/strong>：<code>int *p = &amp;b.b;<\/code> 得到一个错位地址，解引用就是 UB。<\/li>\n<\/ol>\n<p><strong>什么时候真的要用<\/strong>：<br>解析网络协议、读文件头、映射硬件寄存器结构体——这些<strong>字节布局是外部规定死的<\/strong>，不能用编译器默认对齐。<\/p>\n<p><strong>更安全的替代<\/strong>：用 <code>memcpy<\/code> 逐字段搬，或者按字节序列解析，别直接把 <code>struct<\/code> 强转成协议缓冲区。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>三个值对（12 / 7 / 12）。<\/li>\n<li>说清 <code>pack(1)<\/code> 就是取消 padding。<\/li>\n<li>至少说出一个 packed 的代价（性能或可移植性）。<\/li>\n<\/ol>"}, {"id": "M05", "module": "内存", "chapter": "2 内存对齐", "topic": "2.4 malloc 的对齐保证", "outline_ref": "2.4", "qtype": "short", "stage_label": "常见错误", "difficulty": 3, "plain": "两个问题： 1. malloc 返回的地址一定是对齐的吗？对齐到多少？ 2. 如果我把一个「奇数字节偏移」的 char 强转成 int 并解引用，会发生什么？", "stem_html": "<p><strong>两个问题：<\/strong><\/p>\n<ol>\n<li><code>malloc<\/code> 返回的地址一定是对齐的吗？对齐到多少？<\/li>\n<li>如果我把一个「奇数字节偏移」的 <code>char *<\/code> 强转成 <code>int *<\/code> 并解引用，会发生什么？<\/li>\n<\/ol>", "answer_html": "<p><strong>1. 是，而且保证「足够严格」。<\/strong><\/p>\n<p>标准要求 <code>malloc<\/code> 返回的地址<strong>能用于任意类型<\/strong>，实际实现一般按 <code>max_align_t<\/code> 对齐（x86-64 上是 <strong>16 字节<\/strong>，32 位 x86 上是 8 字节）。<\/p>\n<p>所以：<\/p>\n<pre><code class=\"lang-c\">int *p = malloc(100);   /* 不用强转，也是对齐的 */\nstruct S *s = malloc(sizeof *s);<\/code><\/pre>\n<p><strong>2. 未对齐访问：先 UB，再看平台脸色。<\/strong><\/p>\n<pre><code class=\"lang-c\">char buf[8];\nint *p = (int *)(buf + 1);   /* 地址是 1、5、9… 这种奇数 */\n*p = 42;                     /* 未对齐写 */<\/code><\/pre>\n<table><thead><tr><th>平台<\/th><th>现象<\/th><\/tr><\/thead><tbody><tr><td>x86/x86-64<\/td><td>通常能跑，但慢（可能拆成两次访存）<\/td><\/tr><tr><td>ARMv7（默认）<\/td><td>触发 <code>SIGBUS<\/code> / HardFault，直接挂<\/td><\/tr><tr><td>ARMv8、部分 MIPS<\/td><td>也可能异常<\/td><\/tr><\/tbody><\/table>\n<p><strong>而且它本身就是 UB<\/strong>：标准没规定未对齐指针能解引用，所以「在 x86 上能跑」不代表代码对。<\/p>\n<p><strong>顺带两个坑<\/strong><\/p>\n<ul>\n<li>从协议缓冲区里按偏移取 <code>int<\/code>，正确做法是 <code>memcpy(&amp;v, buf + offset, sizeof v)<\/code>，别强转。<\/li>\n<li><code>malloc(size)<\/code> 分配的大小不够 + 强转成大类型 → 越界，和未对齐是两回事，别混。<\/li>\n<\/ul>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出 malloc 保证对齐（16/8 字节）。<\/li>\n<li>指出未对齐解引用是 UB，x86 能跑只是运气。<\/li>\n<li>知道 <code>memcpy<\/code> 是安全取法。<\/li>\n<\/ol>"}, {"id": "M06", "module": "内存", "chapter": "3 函数栈帧", "topic": "3.1-3.2 栈帧组成与参数传递", "outline_ref": "3.1-3.2", "qtype": "short", "stage_label": "概念", "difficulty": 3, "plain": "函数调用时栈上发生了什么？ 一个栈帧里主要有哪些东西？参数是通过栈还是寄存器传的？「返回局部变量的地址」为什么必然出错？", "stem_html": "<p><strong>函数调用时栈上发生了什么？<\/strong><\/p>\n<p>一个栈帧里主要有哪些东西？参数是通过栈还是寄存器传的？「返回局部变量的地址」为什么必然出错？<\/p>", "answer_html": "<p><strong>栈帧（从高地址到低地址大致）<\/strong><\/p>\n<pre><code>调用者的栈帧\n─────────────\n参数（超出寄存器的那部分）\n返回地址        ← call 指令压进来的\n旧的 ebp/rbp    ← 保存调用者的帧指针\n局部变量\n临时变量 / 对齐填充\n─────────────\n被调用者的栈帧<\/code><\/pre>\n<p><strong>参数怎么传<\/strong>：看 ABI，不是\"一律走栈\"。<\/p>\n<ul>\n<li>x86-64 System V：前 6 个整型参数放 <code>rdi, rsi, rdx, rcx, r8, r9<\/code>，浮点走 <code>xmm0-7<\/code>，<strong>超出的才压栈<\/strong><\/li>\n<li>32 位 x86 <code>cdecl<\/code>：全部压栈，调用者负责清栈<\/li>\n<li>ARM 32 位：前 4 个走 <code>r0-r3<\/code><\/li>\n<\/ul>\n<p>所以「参数在栈上」这个说法只在参数很多或老 ABI 下成立。<\/p>\n<p><strong>为什么返回局部变量地址必错<\/strong><\/p>\n<p>局部变量随栈帧存在。函数 <code>ret<\/code> 时 <code>esp/rsp<\/code> 回退，那块内存<strong>归还给栈<\/strong>——<br>它还在地址空间里，但已经不属于你的变量了。之后任何一次函数调用都可能覆盖它。<\/p>\n<p>严格说是 <strong>UB<\/strong>：不保证崩、不保证不崩，加一行 <code>printf<\/code> 结果就可能变。<br>（这就是「悬垂指针」的典型来源。）<\/p>\n<p><strong>正确做法<\/strong>：让调用者给缓冲区、返回 <code>static<\/code>、或者堆上分配（调用者 free）。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出返回地址、旧帧指针、局部变量至少三样。<\/li>\n<li>知道参数优先走寄存器（x86-64）。<\/li>\n<li>说清「栈帧回收 = 变量生命周期结束」。<\/li>\n<\/ol>"}, {"id": "M07", "module": "内存", "chapter": "3 函数栈帧", "topic": "3.3 栈溢出与递归深度", "outline_ref": "3.3", "qtype": "code_read", "stage_label": "代码用法", "difficulty": 3, "plain": "这段代码为什么会挂？什么情况下会挂？怎么改？", "stem_html": "<p><strong>这段代码为什么会挂？什么情况下会挂？怎么改？<\/strong><\/p>\n<pre><code class=\"lang-c\">int sum(int n)\n{\n    int buf[1024];          /* 4KB */\n    buf[0] = n;\n    if (n &lt;= 0) return 0;\n    return n + sum(n - 1);\n}<\/code><\/pre>", "answer_html": "<p><strong>挂的原因是栈溢出（stack overflow），不是逻辑错。<\/strong><\/p>\n<p>每次递归调用都会新建一个栈帧，里面带着 <strong>4KB 的 <code>buf<\/code><\/strong>。<br><code>sum(10000)<\/code> 大约需要 10000 × 4KB ≈ <strong>40MB<\/strong> 栈——而 Linux 主线程默认栈只有 <strong>8MB<\/strong>，<br>于是压到栈底保护页 → <code>SIGSEGV<\/code>。<\/p>\n<p><strong>估算方式<\/strong>：<code>递归深度 × 单帧大小 ≈ 需要的栈<\/code>。<br>单帧大小可以用 <code>sizeof<\/code> 粗略估，更准的方法是看汇编里的 <code>sub rsp, N<\/code>。<\/p>\n<p><strong>三种改法<\/strong><\/p>\n<ol>\n<li><strong>去掉大局部变量<\/strong>：把 <code>buf<\/code> 改成 <code>static<\/code> 或函数外数组，单帧瞬间变小<\/li>\n<li><strong>改成迭代<\/strong>（最稳）：<\/li>\n<\/ol>\n<pre><code class=\"lang-c\">   int sum(int n) { int s = 0; while (n &gt; 0) s += n--; return s; }<\/code><\/pre>\n<ol>\n<li><strong>调整栈大小<\/strong>：Linux 上 <code>ulimit -s 65536<\/code>（临时），或线程创建时指定栈大小；<\/li>\n<\/ol>\n<p>   嵌入式里在启动文件/链接脚本里改<\/p>\n<p><strong>顺带<\/strong>：「递归一定比循环慢」不完全对——开了优化后尾递归可能被转成循环，<br>但 C 不保证尾调用优化（这点和 Scheme 不同），所以别依赖。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出栈溢出，且能算出大致需要多少栈。<\/li>\n<li>给出至少一种改法。<\/li>\n<li>知道默认栈大小（8MB）这类的数量级。<\/li>\n<\/ol>"}, {"id": "M08", "module": "内存", "chapter": "4 堆是怎么管的", "topic": "4.1-4.2 堆怎么管 / 为什么 free 要原始地址", "outline_ref": "4.1-4.2", "qtype": "short", "stage_label": "概念", "difficulty": 3, "plain": "free(p + 1) 为什么会崩？ 顺着这个问题说清楚： malloc 返回给你的那块内存， 前后 还藏着什么？ free 是怎么靠一个指针把整块归还的？", "stem_html": "<p><strong><code>free(p + 1)<\/code> 为什么会崩？<\/strong><\/p>\n<p>顺着这个问题说清楚：<code>malloc<\/code> 返回给你的那块内存，<strong>前后<\/strong>还藏着什么？<code>free<\/code> 是怎么靠一个指针把整块归还的？<\/p>", "answer_html": "<p><strong>因为 <code>free<\/code> 需要从你给的指针倒推出「这一块的元信息」。<\/strong><\/p>\n<p>分配器在每次 <code>malloc<\/code> 时，会在<strong>用户数据前面<\/strong>加一个块头（chunk header），常见内容：<\/p>\n<table><thead><tr><th>字段<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>块大小 <code>size<\/code><\/td><td>归还时知道要还多少字节<\/td><\/tr><tr><td>是否在用标志位<\/td><td>区分已分配 / 空闲<\/td><\/tr><tr><td>前后块的指针 / 边界标记<\/td><td>合并相邻空闲块、维护空闲链表<\/td><\/tr><\/tbody><\/table>\n<p>所以你拿到的 <code>p<\/code> = <strong>块头之后<\/strong>的第一个用户字节。<code>free(p)<\/code> 做的是：<\/p>\n<ol>\n<li><code>p - offsetof(header)<\/code> → 找回块头<\/li>\n<li>读 <code>size<\/code> → 知道这一块多大<\/li>\n<li>标成空闲，尝试和前后空闲块合并，挂回空闲链表<\/li>\n<\/ol>\n<p>你传 <code>p + 1<\/code>，第 1 步算出来的就是<strong>块中间的垃圾<\/strong>，<code>size<\/code> 一读，堆结构直接报废 →<br>glibc 报 <code>free(): invalid pointer<\/code> 并 abort。<\/p>\n<p><strong>这也解释了另外几件事<\/strong><\/p>\n<ul>\n<li>为什么 <code>free<\/code> 之后不能再用 <code>p<\/code>（那块已经被挂回链表，可能被合并/复用）<\/li>\n<li>为什么 <code>free(NULL)<\/code> 安全（特判返回）<\/li>\n<li>为什么两次 <code>free<\/code> 同一地址会 <code>double free or corruption<\/code><\/li>\n<\/ul>\n<p><strong>空闲链表怎么找块<\/strong>：glibc 按大小分成多个 bin（fastbin/smallbin/largebin），<br>分配时先去对应 bin 里找，找不到再向系统 <code>brk/mmap<\/code> 要——这就是\"快速适配 + 分割/合并\"的思路。<br>内核里对应的机制是 slab / <code>kmem_cache<\/code>。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出块头存在，且位置在用户数据前面。<\/li>\n<li>说清 <code>free<\/code> 靠「指针回退找块头 + 读 size」归还。<\/li>\n<li>举出至少一个衍生结论（不能二次 free / free(NULL) 安全）。<\/li>\n<\/ol>"}, {"id": "K01", "module": "关键字", "chapter": "1 九个关键字", "topic": "1.1 #define 宏定义", "outline_ref": "1.1", "qtype": "short", "stage_label": "概念", "difficulty": 2, "plain": "define 到底是什么？ 它发生在哪个阶段？和普通变量的区别在哪三点？为什么说「宏没有类型检查」是它的根本缺陷？", "stem_html": "<p><strong><code>#define<\/code> 到底是什么？<\/strong><\/p>\n<p>它发生在哪个阶段？和普通变量的区别在哪三点？为什么说「宏没有类型检查」是它的根本缺陷？<\/p>", "answer_html": "<p><strong>宏是预处理阶段的纯文本替换<\/strong>，发生在编译之前，编译器根本看不到宏。<\/p>\n<pre><code class=\"lang-c\">#define MAX 100\nint a[MAX];      /* 预处理后变成 int a[100]; */<\/code><\/pre>\n<p><strong>三点本质区别<\/strong><\/p>\n<table><thead><tr><th><\/th><th>宏<\/th><th>变量 / const<\/th><\/tr><\/thead><tbody><tr><td>处理阶段<\/td><td>预处理（文本替换）<\/td><td>编译/运行<\/td><\/tr><tr><td>有类型吗<\/td><td><strong>没有<\/strong><\/td><td>有<\/td><\/tr><tr><td>有作用域吗<\/td><td><strong>没有<\/strong>（从定义处到文件末尾，或 <code>#undef<\/code>）<\/td><td>有<\/td><\/tr><tr><td>调试器能看吗<\/td><td>看不到（已经被替换掉了）<\/td><td>能看<\/td><\/tr><\/tbody><\/table>\n<p><strong>「没有类型检查」意味着什么<\/strong><\/p>\n<pre><code class=\"lang-c\">#define MAX 100\ndouble d = MAX / 3.0;     /* 没问题 */\nchar *p = MAX;            /* 编译期就报错，但错在 int→指针，不是宏的错 */<\/code><\/pre>\n<p>宏只负责把 <code>MAX<\/code> 换成 <code>100<\/code>，<strong>换成什么它不关心<\/strong>。<br>所以宏拼错、少括号、类型不匹配，错误信息都指向「展开后的代码」，极难定位。<\/p>\n<p><strong>所以 C 里优先用 <code>const<\/code> / <code>enum<\/code> / <code>static inline<\/code> 替代简单宏<\/strong>：<br>有类型、可调试、有作用域。宏只留给「必须做文本替换」的场合（如 <code>#ifdef<\/code> 的条件、<code>__FILE__<\/code>）。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说清「预处理阶段的文本替换」。<\/li>\n<li>说出无类型、无作用域、调试器看不到中的两点。<\/li>\n<li>知道优先用 const/enum 替代。<\/li>\n<\/ol>"}, {"id": "K02", "module": "关键字", "chapter": "1 九个关键字", "topic": "1.2 typedef 改名", "outline_ref": "1.2", "qtype": "short", "stage_label": "常见错误", "difficulty": 2, "plain": "typedef 和 define 都能「起别名」，差别在哪？ 用一个例子说明：为什么给指针起别名时，两者会出完全不同的问题？", "stem_html": "<p><strong><code>typedef<\/code> 和 <code>#define<\/code> 都能「起别名」，差别在哪？<\/strong><\/p>\n<p>用一个例子说明：为什么给指针起别名时，两者会出完全不同的问题？<\/p>", "answer_html": "<p><strong><code>typedef<\/code> 是给类型起别名，由编译器处理；<code>#define<\/code> 是文本替换，由预处理器处理。<\/strong><\/p>\n<table><thead><tr><th><\/th><th><code>typedef<\/code><\/th><th><code>#define<\/code><\/th><\/tr><\/thead><tbody><tr><td>谁处理<\/td><td>编译器<\/td><td>预处理器<\/td><\/tr><tr><td>类型安全<\/td><td>是<\/td><td>否<\/td><\/tr><tr><td>作用域<\/td><td>遵循块作用域<\/td><td>从定义到处文件末尾<\/td><\/tr><tr><td>指针别名<\/td><td>正确<\/td><td><strong>会踩坑<\/strong><\/td><\/tr><\/tbody><\/table>\n<p><strong>经典反例<\/strong><\/p>\n<pre><code class=\"lang-c\">typedef char *pchar;\n#define PCHAR char *\n\npchar a, b;    /* a、b 都是 char *  —— 对 */\nPCHAR c, d;    /* 展开成 char * c, d;  → c 是 char*，d 是 char！ */<\/code><\/pre>\n<p><code>#define<\/code> 只是把 <code>PCHAR<\/code> 换成 <code>char *<\/code>，于是 <code>char * c, d;<\/code> 里的 <code>*<\/code> 只修饰 <code>c<\/code>。<br><code>typedef<\/code> 是给「char *」这个类型整体起名，声明两个变量都是指针。<\/p>\n<p><strong>所以<\/strong>：结构体、函数指针、指针类型，一律用 <code>typedef<\/code>。<\/p>\n<pre><code class=\"lang-c\">typedef int (*binop_t)(int, int);   /* 函数指针别名，最常用的场景 */<\/code><\/pre>\n<p><strong>注意<\/strong>：<code>typedef struct {...} Foo;<\/code> 并没有定义新类型，只是给匿名结构体起了个名字；<br>原类型 <code>struct {...}<\/code> 依然存在。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出「编译器 vs 预处理器」。<\/li>\n<li>举出指针别名的反例。<\/li>\n<li>知道函数指针用 typedef 化简。<\/li>\n<\/ol>"}, {"id": "K03", "module": "关键字", "chapter": "1 九个关键字", "topic": "1.3 extern", "outline_ref": "1.3", "qtype": "short", "stage_label": "概念", "difficulty": 3, "plain": "extern 到底在做什么？ extern int g count; 和 int g count; 有什么区别？跨文件用一个全局变量，标准写法是什么？", "stem_html": "<p><strong><code>extern<\/code> 到底在做什么？<\/strong><\/p>\n<p><code>extern int g_count;<\/code> 和 <code>int g_count;<\/code> 有什么区别？跨文件用一个全局变量，标准写法是什么？<\/p>", "answer_html": "<p><strong><code>extern<\/code> 表示「这是一个声明，不是定义」<\/strong>——东西在别处，别在这里分配存储。<\/p>\n<table><thead><tr><th><\/th><th><code>extern int g_count;<\/code><\/th><th><code>int g_count;<\/code><\/th><\/tr><\/thead><tbody><tr><td>性质<\/td><td>声明<\/td><td><strong>定义（tentative definition）<\/strong><\/td><\/tr><tr><td>分配存储吗<\/td><td>不分配<\/td><td>分配<\/td><\/tr><tr><td>能出现几次<\/td><td>任意多次<\/td><td>只能有一次<\/td><\/tr><\/tbody><\/table>\n<p><strong>跨文件的正确写法<\/strong><\/p>\n<pre><code class=\"lang-c\">/* global.h */\nextern int g_count;        /* 声明，谁 include 都安全 */\n\n/* global.c */\nint g_count = 0;           /* 定义，只此一处 */\n\n/* main.c */\n#include &quot;global.h&quot;\ng_count++;                 /* 用的是同一个对象 */<\/code><\/pre>\n<p><strong>为什么必须这样<\/strong><br>头文件是文本插入，<code>main.c<\/code> 和 <code>other.c<\/code> 都 include 它。<br>如果头文件里写的是 <code>int g_count;<\/code>（定义），链接时符号表里就有两份 → <code>multiple definition<\/code>。<\/p>\n<p><strong>三个追问<\/strong><\/p>\n<ol>\n<li><code>extern<\/code> 能修饰函数吗？能，但函数默认就是外部链接，写了也等于没写。<\/li>\n<li><code>extern \"C\"<\/code> 是什么？C++ 里用来关闭名字修饰（name mangling），让 C++ 能链接 C 的库。<\/li>\n<li>只写 <code>extern<\/code> 不写类型可以吗？可以但没意义（<code>extern int a;<\/code> 必须带类型）。<\/li>\n<\/ol>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>分清声明与定义。<\/li>\n<li>说出「头文件只放 extern 声明，定义放一个 .c」。<\/li>\n<li>知道 <code>extern \"C\"<\/code> 是 C++ 的场景。<\/li>\n<\/ol>"}, {"id": "K04", "module": "关键字", "chapter": "1 九个关键字", "topic": "1.4 static 静态变量", "outline_ref": "1.4", "qtype": "short", "stage_label": "概念", "difficulty": 3, "plain": "static 有三个完全不同的用法，分别是什么？ 各写一行代码示意，并说明它改的是「生命周期」还是「可见性」。", "stem_html": "<p><strong><code>static<\/code> 有三个完全不同的用法，分别是什么？<\/strong><\/p>\n<p>各写一行代码示意，并说明它改的是「生命周期」还是「可见性」。<\/p>", "answer_html": "<table><thead><tr><th>位置<\/th><th>含义<\/th><th>改的是<\/th><\/tr><\/thead><tbody><tr><td>函数内部<\/td><td><strong>静态局部变量<\/strong>：只初始化一次，生命周期直到程序结束<\/td><td>生命周期<\/td><\/tr><tr><td>文件作用域的变量前<\/td><td><strong>内部链接<\/strong>：只本文件可见，别的文件 <code>extern<\/code> 也拿不到<\/td><td>可见性<\/td><\/tr><tr><td>函数前<\/td><td><strong>内部链接函数<\/strong>：只本文件可调用<\/td><td>可见性<\/td><\/tr><\/tbody><\/table>\n<pre><code class=\"lang-c\">void f(void) {\n    static int cnt = 0;    /* ① 只初始化一次，下次调用还是上次的值 */\n    cnt++;\n}\n\nstatic int g_val = 1;      /* ② 本文件私有全局 */\nstatic void helper(void);  /* ③ 本文件私有函数 */<\/code><\/pre>\n<p><strong>最常被问的点<\/strong><\/p>\n<ul>\n<li>① 的初始化<strong>只执行一次<\/strong>，且静态区变量<strong>默认清零<\/strong>（不是栈上的垃圾值）。<\/li>\n<\/ul>\n<p>  典型用途：函数调用计数、懒初始化、返回局部缓冲区的替代方案。<\/p>\n<ul>\n<li>②③ 是「模块私有」的手段，用来避免命名冲突，也让链接器能做死代码消除。<\/li>\n<li>函数里的 <code>static<\/code> 变量<strong>不是线程安全的<\/strong>（多线程共享这一份）。<\/li>\n<\/ul>\n<p><strong>一个易错点<\/strong>：函数内 <code>static<\/code> 变量的地址在<strong>整个程序期间不变<\/strong>，但它仍然只在该函数作用域内可见。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>三种用法齐全，且分清「生命周期」与「可见性」。<\/li>\n<li>知道静态变量默认清零。<\/li>\n<li>知道它只初始化一次、是共享的。<\/li>\n<\/ol>"}, {"id": "K05", "module": "关键字", "chapter": "1 九个关键字", "topic": "1.6 sizeof", "outline_ref": "1.6", "qtype": "short", "stage_label": "常见错误", "difficulty": 2, "plain": "关于 sizeof 的三个判断题： 1. sizeof 是函数吗？ 2. int i = 0; sizeof(i++); 之后 i 是多少？ 3. void f(int a[10]…", "stem_html": "<p><strong>关于 <code>sizeof<\/code> 的三个判断题：<\/strong><\/p>\n<ol>\n<li><code>sizeof<\/code> 是函数吗？<\/li>\n<li><code>int i = 0; sizeof(i++);<\/code> 之后 <code>i<\/code> 是多少？<\/li>\n<li><code>void f(int a[10]) { sizeof(a) }<\/code> 得到多少？<\/li>\n<\/ol>\n<p>分别说明原因。<\/p>", "answer_html": "<p><strong>1. 不是函数，是运算符<\/strong>，在<strong>编译期<\/strong>求值（C99 的变长数组除外）。<br>所以它可以作用于类型：<code>sizeof(int)<\/code>；也不能被取地址、不能当函数指针用。<\/p>\n<p><strong>2. <code>i<\/code> 还是 0。<\/strong> <code>sizeof<\/code> 的操作数<strong>不会被求值<\/strong>，编译器只需要知道它的类型。<br>（例外：VLA <code>sizeof(vla)<\/code> 会在运行期算。）<\/p>\n<p><strong>3. 得到指针大小（8 / 4），不是 40。<\/strong><\/p>\n<p>因为数组作函数参数会<strong>退化<\/strong>成 <code>int *<\/code>，函数里 <code>a<\/code> 的类型就是指针，<code>sizeof(a)<\/code> 是指针大小。<\/p>\n<p><strong>再补三个常见坑<\/strong><\/p>\n<ul>\n<li><code>sizeof(char)<\/code> 恒为 1；<code>sizeof<\/code> 的结果类型是 <code>size_t<\/code>，打印用 <code>%zu<\/code><\/li>\n<li><code>sizeof(\"abc\")<\/code> = <strong>4<\/strong>（含 <code>'\\0'<\/code>），<code>strlen(\"abc\")<\/code> = 3<\/li>\n<li><code>sizeof *p<\/code> 和 <code>sizeof(*p)<\/code> 一样；写成 <code>sizeof *p + 1<\/code> 会是 <code>sizeof(*p) + 1<\/code> 还是 <code>sizeof(*p + 1)<\/code>？<\/li>\n<\/ul>\n<p>  → 前者，<code>sizeof<\/code> 的优先级高于 <code>+<\/code><\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出「运算符、编译期求值」。<\/li>\n<li>说出「不求值，<code>i<\/code> 不变」。<\/li>\n<li>说出「数组参数退化成指针」。<\/li>\n<\/ol>"}, {"id": "K06", "module": "关键字", "chapter": "1 九个关键字", "topic": "1.8 register / 1.9 enum", "outline_ref": "1.8-1.9", "qtype": "short", "stage_label": "概念", "difficulty": 2, "plain": "两个问题： 1. enum 和 define 都能定义常量，该用哪个？为什么？ 2. register int i; 现在还有用吗？", "stem_html": "<p><strong>两个问题：<\/strong><\/p>\n<ol>\n<li><code>enum<\/code> 和 <code>#define<\/code> 都能定义常量，该用哪个？为什么？<\/li>\n<li><code>register int i;<\/code> 现在还有用吗？<\/li>\n<\/ol>", "answer_html": "<p><strong>1. 优先 <code>enum<\/code>（或 <code>const<\/code>），理由四条：<\/strong><\/p>\n<table><thead><tr><th><\/th><th><code>enum<\/code><\/th><th><code>#define<\/code><\/th><\/tr><\/thead><tbody><tr><td>有类型吗<\/td><td>有（本质是整型）<\/td><td>没有，纯文本<\/td><\/tr><tr><td>调试器可见<\/td><td>可见（能看到名字）<\/td><td>看不到（已替换）<\/td><\/tr><tr><td>作用域<\/td><td>遵循块作用域<\/td><td>到文件末尾<\/td><\/tr><tr><td>自增 / 成组<\/td><td><code>A, B, C<\/code> 自动 0,1,2<\/td><td>要手写<\/td><\/tr><\/tbody><\/table>\n<pre><code class=\"lang-c\">enum color { RED, GREEN = 5, BLUE };   /* RED=0, GREEN=5, BLUE=6 */<\/code><\/pre>\n<p><strong>注意<\/strong>：<code>enum<\/code> 在 C 里就是 <code>int<\/code>，不强制类型检查（C++ 的 <code>enum class<\/code> 才强）。<\/p>\n<p><strong>2. <code>register<\/code> 基本没用了。<\/strong><\/p>\n<p>它是给编译器的<strong>建议<\/strong>（不是命令）：把变量放寄存器。但：<\/p>\n<ul>\n<li>现代优化器（<code>-O2<\/code>）自己会做寄存器分配，比人准<\/li>\n<li>明确写了 <code>register<\/code> 的变量<strong>不能取地址<\/strong>（<code>&amp;i<\/code> 编译错误），反而限制代码<\/li>\n<li>C11 已把它列为「deprecated」，C++17 直接移除了这个关键字的语义<\/li>\n<\/ul>\n<p><strong>一句话<\/strong>：现在写 <code>register<\/code> 唯一的作用是告诉读代码的人「这个变量很热」，编译器基本无视。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出 enum 有类型、可调试、有作用域、可自增中的两点。<\/li>\n<li>说清 enum 的值从 0 开始、可显式赋值。<\/li>\n<li>知道 register 是建议且基本被忽略。<\/li>\n<\/ol>"}, {"id": "K07", "module": "关键字", "chapter": "2 宏", "topic": "2.3 宏的四个坑", "outline_ref": "2.3", "qtype": "code_read", "stage_label": "常见错误", "difficulty": 3, "plain": "这段代码输出什么？为什么？", "stem_html": "<p><strong>这段代码输出什么？为什么？<\/strong><\/p>\n<pre><code class=\"lang-c\">#include &lt;stdio.h&gt;\n\n#define SQUARE(x) x * x\n#define MAX(a, b) ((a) &gt; (b) ? (a) : (b))\n\nint main(void)\n{\n    int i = 1;\n    printf(&quot;%d\\n&quot;, SQUARE(i + 1));      /* ① */\n    printf(&quot;%d\\n&quot;, SQUARE(i++));        /* ② */\n    printf(&quot;%d\\n&quot;, MAX(i++, 10));       /* ③ */\n    return 0;\n}<\/code><\/pre>", "answer_html": "<p>先看展开结果，再看结果（<code>i<\/code> 初值 1）：<\/p>\n<p><strong>① <code>SQUARE(i + 1)<\/code> 展开成 <code>i + 1 * i + 1<\/code> = <code>1 + 1*1 + 1<\/code> = 3<\/strong>（不是 4）。<\/p>\n<p><strong>② <code>SQUARE(i++)<\/code> 展开成 <code>i++ * i++<\/code><\/strong> → 同一个表达式里对 <code>i<\/code> 改了两次，<br><strong>没有序列点 → UB<\/strong>。有的编译器给 2，有的给 3，别依赖。<\/p>\n<p><strong>③ <code>MAX(i++, 10)<\/code> 展开成 <code>((i++) &gt; (10) ? (i++) : (10))<\/code><\/strong> → <code>i<\/code> 被求值两次，<br>不管走哪边 <code>i<\/code> 都会多加一次。这是「参数被求值多次」的经典坑。<\/p>\n<p><strong>正确的写法<\/strong><\/p>\n<pre><code class=\"lang-c\">/* 1. 每个参数、整个表达式都加括号 */\n#define SQUARE(x) ((x) * (x))\n#define MAX(a, b) ((a) &gt; (b) ? (a) : (b))\n\n/* 2. 多语句宏用 do{}while(0) 包起来 */\n#define LOG(fmt, ...) do {            \\\n        printf(&quot;[log] &quot; fmt &quot;\\n&quot;, ##__VA_ARGS__); \\\n    } while (0)\n\nif (cond)\n    LOG(&quot;ok&quot;);        /* 不加 do-while 这里会展开成两条语句，if 只管住第一条 */\nelse\n    LOG(&quot;fail&quot;);<\/code><\/pre>\n<p><strong>3. 能不用宏就别用<\/strong>：<code>static inline<\/code> 函数有类型检查、能调试、参数只求值一次。<\/p>\n<p><strong><code>#<\/code> 与 <code>##<\/code><\/strong><\/p>\n<ul>\n<li><code>#x<\/code>：把参数变成字符串 → <code>#define STR(x) #x<\/code>，<code>STR(123)<\/code> → <code>\"123\"<\/code><\/li>\n<li><code>a##b<\/code>：拼接标识符 → <code>#define CAT(a,b) a##b<\/code>，<code>CAT(foo,bar)<\/code> → <code>foobar<\/code><\/li>\n<\/ul>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>① 算出 3，并解释少括号。<\/li>\n<li>② 指出是 UB（同一表达式两次修改）。<\/li>\n<li>说出 <code>do{}while(0)<\/code> 的用途，知道 <code>#<\/code>/<code>##<\/code> 各管什么。<\/li>\n<\/ol>"}, {"id": "K08", "module": "关键字", "chapter": "2 宏", "topic": "2.1-2.2 宏的作用实例 / 常见嵌入式宏", "outline_ref": "2.1-2.2", "qtype": "short", "stage_label": "代码用法", "difficulty": 3, "plain": "写出下面这些宏，并各用一句话说明用途： 1. 取数组元素个数 ARRAY SIZE 2. 置位 / 清位（第 n 位） 3. 求结构体成员的偏移 OFFSETOF 4. 由成员地址…", "stem_html": "<p><strong>写出下面这些宏，并各用一句话说明用途：<\/strong><\/p>\n<ol>\n<li>取数组元素个数 <code>ARRAY_SIZE<\/code><\/li>\n<li>置位 / 清位（第 n 位）<\/li>\n<li>求结构体成员的偏移 <code>OFFSETOF<\/code><\/li>\n<li>由成员地址反推结构体首地址 <code>container_of<\/code><\/li>\n<li>求两个数的最大值（安全版）<\/li>\n<\/ol>", "answer_html": "<pre><code class=\"lang-c\">/* 1. 数组元素个数（只对真数组有效，传指针就废） */\n#define ARRAY_SIZE(a) (sizeof(a) / sizeof((a)[0]))\n\n/* 2. 位操作 */\n#define BIT(n)        (1UL &lt;&lt; (n))\n#define SET_BIT(r, n) ((r) |=  BIT(n))\n#define CLR_BIT(r, n) ((r) &amp;= ~BIT(n))\n#define TOG_BIT(r, n) ((r) ^=  BIT(n))\n#define GET_BIT(r, n) (((r) &gt;&gt; (n)) &amp; 1UL)\n\n/* 3. 成员偏移：把 0 当地址强转成结构体指针，取成员地址就是偏移 */\n#define OFFSETOF(type, member) ((size_t)&amp;(((type *)0)-&gt;member))\n\n/* 4. 由成员地址反推外层结构体首地址（内核链表的基础） */\n#define container_of(ptr, type, member) ({                \\\n    const typeof(((type *)0)-&gt;member) *__mptr = (ptr);    \\\n    (type *)((char *)__mptr - OFFSETOF(type, member)); })\n\n/* 5. 安全的 MAX：参数加括号 + 整体加括号 */\n#define MAX(a, b) ((a) &gt; (b) ? (a) : (b))<\/code><\/pre>\n<p><strong>几个必须说的点<\/strong><\/p>\n<ul>\n<li><code>ARRAY_SIZE<\/code> 只在数组还在作用域时有效；数组传进函数后退化成指针，算出来是指针大小/元素大小，<strong>错得无声无息<\/strong>。<\/li>\n<li><code>BIT(n)<\/code> 用 <code>1UL<\/code> 而不是 <code>1<\/code>，避免 <code>1 &lt;&lt; 31<\/code> 变成有符号溢出（UB）。<\/li>\n<li><code>OFFSETOF<\/code> 靠「空指针取成员地址」实现，标准里有专门的 <code>offsetof<\/code> 宏（<code>&lt;stddef.h&gt;<\/code>），<\/li>\n<\/ul>\n<p>  自己写是为了跨编译器。<\/p>\n<ul>\n<li><code>container_of<\/code> 用到了 GNU 扩展 <code>typeof<\/code> 和语句表达式 <code>({ })<\/code>，内核里到处是它；<\/li>\n<\/ul>\n<p>  这就是「链表结点不用单独分配、直接嵌在业务结构体里」的关键。<\/p>\n<ul>\n<li><code>MAX(a, b)<\/code> 仍然<strong>会把参数求值两次<\/strong>，<code>MAX(i++, j++)<\/code> 依旧有坑，这点宏解决不了。<\/li>\n<\/ul>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>五个宏都能写出来（允许细节差异）。<\/li>\n<li>说出 <code>ARRAY_SIZE<\/code> 在指针上失效。<\/li>\n<li>说清 <code>container_of<\/code> 的用途（内核链表）。<\/li>\n<\/ol>"}, {"id": "K09", "module": "关键字", "chapter": "3 存储类与链接属性", "topic": "3.1-3.3 存储类与链接属性", "outline_ref": "3.1-3.3", "qtype": "short", "stage_label": "概念", "difficulty": 3, "plain": "C 的四种存储类说明符分别做什么？ 再说清楚「内部链接」和「外部链接」的区别——它们和 static / extern 是怎么对应的？", "stem_html": "<p><strong>C 的四种存储类说明符分别做什么？<\/strong><\/p>\n<p>再说清楚「内部链接」和「外部链接」的区别——它们和 <code>static<\/code> / <code>extern<\/code> 是怎么对应的？<\/p>", "answer_html": "<table><thead><tr><th>存储类<\/th><th>作用<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td><code>auto<\/code><\/td><td>自动变量（默认就是它）<\/td><td>几乎不用写<\/td><\/tr><tr><td><code>register<\/code><\/td><td>建议放寄存器<\/td><td>现代基本被忽略，且不能取地址<\/td><\/tr><tr><td><code>static<\/code><\/td><td>见下（两种含义）<\/td><td>改生命周期或可见性<\/td><\/tr><tr><td><code>extern<\/code><\/td><td>声明「定义在别处」<\/td><td>只声明，不分配<\/td><\/tr><\/tbody><\/table>\n<p><strong>链接属性（这才是关键）<\/strong><\/p>\n<table><thead><tr><th>链接<\/th><th>含义<\/th><th>怎么产生<\/th><\/tr><\/thead><tbody><tr><td><strong>外部链接<\/strong><\/td><td>全程序可见，链接器能跨文件解析<\/td><td>普通全局变量、普通函数（默认）<\/td><\/tr><tr><td><strong>内部链接<\/strong><\/td><td>只本翻译单元可见，别的文件看不到<\/td><td>全局变量/函数前加 <code>static<\/code><\/td><\/tr><tr><td><strong>无链接<\/strong><\/td><td>只有局部作用域<\/td><td>函数内的自动变量、局部 static、形参<\/td><\/tr><\/tbody><\/table>\n<p><strong>三组对照<\/strong><\/p>\n<pre><code class=\"lang-c\">int  g1;            /* 外部链接：别的文件 extern 也能用 */\nstatic int g2;      /* 内部链接：本文件私有 */\n\nvoid f(void) {      /* 外部链接 */\n    static int cnt; /* 无链接（名字只在本函数可见），但生命周期是全程序 */\n}<\/code><\/pre>\n<p><strong>容易混的一点<\/strong>：<code>static<\/code> 在<strong>函数内<\/strong>改的是<strong>生命周期<\/strong>（存在静态区，程序结束才释放），<br>在<strong>文件作用域<\/strong>改的是<strong>可见性<\/strong>（内部链接）。同名不同义，看位置。<\/p>\n<p><strong>实用建议<\/strong>：一个模块里所有不对外暴露的函数和全局变量都加 <code>static<\/code>——<br>既避免命名冲突，也让链接器能裁剪掉未使用的代码。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>四种存储类都说得出。<\/li>\n<li>分清「外部链接 / 内部链接 / 无链接」。<\/li>\n<li>说清 <code>static<\/code> 在两处位置的不同含义。<\/li>\n<\/ol>"}, {"id": "K10", "module": "关键字", "chapter": "4 其他常见关键字", "topic": "4.1-4.4 其他关键字与三组易混", "outline_ref": "4.1-4.4", "qtype": "short", "stage_label": "概念", "difficulty": 2, "plain": "三个小问题： 1. inline 一定会内联展开吗？ 2. restrict 是什么？ 3. 把三组最容易混的组合各用一句话区分： typedef vs define 、 enum…", "stem_html": "<p><strong>三个小问题：<\/strong><\/p>\n<ol>\n<li><code>inline<\/code> 一定会内联展开吗？<\/li>\n<li><code>restrict<\/code> 是什么？<\/li>\n<li>把三组最容易混的组合各用一句话区分：<code>typedef<\/code> vs <code>#define<\/code>、<code>enum<\/code> vs <code>#define<\/code>、<code>const<\/code> vs <code>#define<\/code>。<\/li>\n<\/ol>", "answer_html": "<p><strong>1. <code>inline<\/code> 是建议，不是命令。<\/strong><br>编译器有权不理（函数太大、开了 <code>-O0<\/code> 时通常就不内联）。<br>它的真正价值是<strong>允许把函数定义放头文件而不引发 multiple definition<\/strong>（配合 <code>static inline<\/code> 使用）。<\/p>\n<p><strong>2. <code>restrict<\/code> 是给编译器的「无别名」承诺。<\/strong><br><code>void *memcpy(void *restrict dst, const void *restrict src, size_t n);<\/code><br>意思是：<code>dst<\/code> 和 <code>src<\/code> 指向的内存不重叠。编译器据此可以放心做向量化、减少重复加载。<br><strong>你撒谎就是 UB<\/strong>——这正是 <code>memcpy<\/code> 不能处理重叠、要用 <code>memmove<\/code> 的原因。<\/p>\n<p><strong>3. 三组一句话<\/strong><\/p>\n<table><thead><tr><th>对比<\/th><th>一句话<\/th><\/tr><\/thead><tbody><tr><td><code>typedef<\/code> vs <code>#define<\/code><\/td><td>typedef 是<strong>类型别名<\/strong>（编译器处理、有类型、有作用域）；#define 是<strong>文本替换<\/strong>（预处理器处理，<code>PCHAR c, d<\/code> 会坑）<\/td><\/tr><tr><td><code>enum<\/code> vs <code>#define<\/code><\/td><td>enum 有类型、可调试、能自增、有作用域；#define 只是替换<\/td><\/tr><tr><td><code>const<\/code> vs <code>#define<\/code><\/td><td>const 有类型、可调试、占存储（可能被优化掉）；#define 无类型、纯替换<\/td><\/tr><\/tbody><\/table>\n<p><strong>补一句 <code>_Static_assert<\/code>（C11）<\/strong>：<br><code>_Static_assert(sizeof(int) == 4, \"需要 32 位 int\");<\/code><br>编译期断言，不满足直接编译失败。用来在代码里\"锁定\"平台假设，嵌入式里很有用。<\/p>\n<p><strong>要点（自评用）<\/strong><\/p>\n<ol>\n<li>说出 inline 只是建议、主要作用是放头文件。<\/li>\n<li>说清 restrict 是「承诺不重叠」。<\/li>\n<li>三组对比各说对一句。<\/li>\n<\/ol>"}];</script>
<script>/* C 刷题 · 离线单页版
   题库在 window.__BANK__，答题记录存 localStorage，导出/导入按 id 合并。 */
(function () {
  'use strict';

  const BANK = window.__BANK__ || [];
  const KEY = 'cquiz.data.v1';
  const QT = { short: '简答', code_read: '程序阅读', handwrite: '手撕', single: '单选', multi: '多选', judge: '判断', fill: '填空' };
  const GRADE = { 0: '错', 1: '半对', 2: '对' };

  let S = load();
  let session = null;
  let cur = null;

  const $ = (s, r) => (r || document).querySelector(s);
  const app = () => document.getElementById('app');

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.attempts)) return d;
    } catch (e) { }
    return { attempts: [] };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function go(name) {
    // hash 相同不会触发 hashchange，这里手动重绘
    if (location.hash === '#' + name) route();
    else location.hash = '#' + name;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function qById(id) { return BANK.find(q => q.id === id); }

  /* ---------------- 派生统计 ---------------- */
  function attemptsOf(qid) {
    return S.attempts.filter(a => a.qid === qid).sort((x, y) => x.ts - y.ts);
  }
  function qState(qid) {
    const list = attemptsOf(qid);
    if (!list.length) return { seen: 0, last: null, wrong: 0, streak: 0 };
    let streak = 0;
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].grade === 2) streak++; else break;
    }
    return {
      seen: list.length,
      last: list[list.length - 1],
      wrong: list.filter(a => a.grade < 2).length,
      streak: streak
    };
  }
  function pool() {
    return BANK.filter(q => { const st = qState(q.id); return st.last && st.last.grade < 2; });
  }
  function mastered() {
    return BANK.filter(q => qState(q.id).streak >= 2);
  }
  function overview() {
    const total = S.attempts.length;
    const right = S.attempts.filter(a => a.grade === 2).length;
    const days = {};
    S.attempts.forEach(a => {
      const d = new Date(a.ts).toISOString().slice(0, 10);
      days[d] = (days[d] || 0) + 1;
    });
    let streak = 0;
    const oneDay = 86400000;
    let d = new Date();
    if (!days[d.toISOString().slice(0, 10)]) d = new Date(Date.now() - oneDay);
    while (days[d.toISOString().slice(0, 10)]) { streak++; d = new Date(d.getTime() - oneDay); }
    const byTopic = {};
    S.attempts.forEach(a => {
      const q = qById(a.qid); if (!q) return;
      const k = q.topic;
      byTopic[k] = byTopic[k] || { n: 0, ok: 0 };
      byTopic[k].n++; if (a.grade === 2) byTopic[k].ok++;
    });
    return {
      bank: BANK.length, total, right,
      acc: total ? Math.round(right * 100 / total) : 0,
      pool: pool().length, mastered: mastered().length,
      today: days[new Date().toISOString().slice(0, 10)] || 0,
      streak, byTopic
    };
  }

    return '<nav class="tabbar">' + tabs.map(([k, ico, label]) =>
      '<a href="#' + k + '" data-tab="' + k + '"><span class="ico">' + ico + '</span>' + label + '</a>').join('') + '</nav>';

  // 章名本身当 key（"1 指针的本质…" 与 "1 编译的四个步骤" 编号会撞车，不能用序号）
  const openCh = new Set();
  let openChInited = false;

  function chapterKey(q) {
    return (q.chapter || q.topic || '其他').trim();
  }

  // 单题状态：'' 没练过 / red 最近答错 / yellow 错过但刚对一次 / blue 答对（首次就对或连对两次）
  function qLevel(qid) {
    const list = attemptsOf(qid);
    if (!list.length) return '';
    if (list[list.length - 1].grade < 2) return 'red';
    let streak = 0;
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].grade === 2) streak++; else break;
    }
    if (list.length === 1) return 'blue';        // 第一次就答对，直接蓝
    return streak >= 2 ? 'blue' : 'yellow';      // 错过一次后对一次=黄，对两次=蓝
  }

  // 小节状态：全部蓝才算蓝；有红就是红；其余（练过但没红没全蓝）算黄
  function topicStatus(topic) {
    const lv = BANK.filter(x => x.topic === topic).map(q => qLevel(q.id));
    if (lv.every(x => !x)) return '';
    if (lv.every(x => x === 'blue')) return 'blue';
    if (lv.some(x => x === 'red')) return 'red';
    return 'yellow';
  }

  function viewPick() {
    const byCh = {};
    const modOf = {};
    BANK.forEach(q => {
      const mod = q.module || '';
      const k = mod + '||' + chapterKey(q);
      if (!byCh[k]) byCh[k] = { name: q.chapter || ('第 ' + k + ' 章'), topics: {} };
      modOf[k] = mod;
      byCh[k].topics[q.topic] = true;
    });
    const types = [...new Set(BANK.map(q => q.qtype))];
    const tcount = {};
    BANK.forEach(q => { tcount[q.qtype] = (tcount[q.qtype] || 0) + 1; });

    let accs = '';
    const chKeys = Object.keys(byCh);          // 保持题库顺序：先指针 5 章，再编译 5 章
    if (!openChInited && chKeys.length) { openCh.add(chKeys[0]); openChInited = true; }
    let lastMod = null;
    chKeys.forEach(k => {
      const ch = byCh[k];
      const mod = modOf[k];
      if (mod && mod !== lastMod) { accs += '<div class="mod">' + esc(mod) + '</div>'; lastMod = mod; }
      const leaves = Object.keys(ch.topics).sort((a, b) => a.localeCompare(b, 'zh', { numeric: true }));
      const total = leaves.reduce((n, t) => n + BANK.filter(q => q.topic === t).length, 0);
      accs += '<div class="acc' + (openCh.has(k) ? ' open' : '') + '" data-ch="' + k + '">' +
        '<button class="acc-head" type="button"><span class="chev">▶</span>' +
        '<span>' + esc(ch.name) + '</span>' +
        '<span class="muted" style="margin-left:auto;font-weight:400">' + total + ' 题</span></button>' +
        '<div class="acc-body">' +
        leaves.map(t => {
          const st = topicStatus(t);
          const dot = st === 'blue' ? '<span class="dot blue" title="已掌握"></span>'
            : st === 'yellow' ? '<span class="dot yellow" title="错过，已对一次"></span>'
              : st === 'red' ? '<span class="dot red" title="最近答错"></span>' : '';
          const n = BANK.filter(q => q.topic === t).length;
          return '<label class="leaf"><input type="checkbox" name="topic" value="' + esc(t) + '">' +
            '<span class="leaf-t">' + esc(t) + '</span>' +
            '<span class="num">' + n + '</span>' +
            '<span class="mk">' + dot + '</span></label>';
        }).join('') +
        '</div></div>';
    });

    return '<div class="card"><h1>选择练习范围</h1>' +
      '<label class="f">模式</label><div class="row">' +
      [['random', '随机'], ['review', '最久未练'], ['wrong', '错题池']].map(([k, l]) =>
        '<label class="btn ghost" style="flex:1"><input type="radio" name="mode" value="' + k + '"' +
        (k === 'random' ? ' checked' : '') + '> ' + l + '</label>').join('') + '</div>' +
      '<label class="f">题型（不选=全部）</label><div class="row">' +
      types.map(t => '<label class="btn ghost" style="flex:1"><input type="checkbox" name="type" value="' + t + '"> ' +
        QT[t] + ' <span class="muted" style="margin-left:auto">' + tcount[t] + '</span></label>').join('') + '</div>' +
      '<label class="f">大纲（点章节展开，不选=全部）</label>' + accs +
      '<label class="f">题数</label><input type="number" id="count" value="10" min="1" max="200">' +
      '<div style="margin-top:16px"><button class="btn primary block" id="go">开始</button></div></div>';
  }

  function viewHist() {
    const nCount = allNotesFlat().length;
    const head = '<div class="card"><h1>作答历史</h1>' +
      '<div class="row" style="margin-top:8px">' +

      return '<div class="rec">' +
        '<div class="sum">' + dot +

        '<div class="sub">共 ' + r.list.length + ' 次 · 错 ' + r.wrong + ' 次 · ' +
        new Date(r.last.ts).toLocaleDateString() + ' 最近</div>' +
        '<details><summary>回看这 ' + r.list.length + ' 次作答</summary>' +
        r.list.map((a, i) => {
          const c = a.grade === 2 ? 'ok' : (a.grade === 1 ? 'mid' : 'no');
          return '<div class="tl-item">' +
            '<div class="tl-h"><span class="pill ' + c + '">' + GRADE[a.grade] + '</span>' +
            '<span class="muted">' + new Date(a.ts).toLocaleString() + '</span>' +
            '<span class="muted">#' + (i + 1) + '</span></div>' +
            '<div class="myans">' + (a.answer ? esc(a.answer) : '（没写文字，直接自评）') + '</div>' +
            '</div>';
        }).join('') +
        '<div class="label">题干</div><div class="ansbox">' + q.stem_html + '</div>' +
        (ns.length ? '<div class="label">我的疑问</div>' +
          ns.map(n => '<div class="note-item">' + esc(n.text) + '</div>').join('') : '') +
        '<div class="label">参考答案</div><div class="ansbox">' + q.answer_html + '</div>' +
        '</details></div>';
    }).join('') + '</div>';
  }

  /* ---------------- 云同步 ---------------- */
  const CK = 'cquiz.cloud.v1';
  function cloudCfg() {
    try { return JSON.parse(localStorage.getItem(CK)) || {}; } catch (e) { return {}; }
  }
  function saveCfg(o) { localStorage.setItem(CK, JSON.stringify(o)); }
  function cloudReady() { const c = cloudCfg(); return !!(c.url && c.key); }
  function cloudStatText() {
    const c = cloudCfg();
    if (!cloudReady()) return '未配置，数据只在本机。';
    const parts = [];
    if (c.remote != null) parts.push('云端 ' + c.remote + ' 条');
    parts.push('本机 ' + S.attempts.length + ' 条');
    if (c.lastSync) parts.push('上次同步 ' + new Date(c.lastSync).toLocaleTimeString());
    return parts.join(' · ');
  }
  function setStatus(txt) {
    const el = document.getElementById('cloudstat');
    if (el) el.textContent = txt;
  }
  function normUrl(u) {
    // 只保留协议+域名，后面多填的 /rest/v1/ 之类自动切掉
    u = (u || '').trim();
    const m = u.match(/^(https?:\/\/[^\/\s]+)/i);
    return m ? m[1] : u.replace(/\/+$/, '');
  }
  function apiBase() { return normUrl(cloudCfg().url); }
  function hdr(c) {
    return { 'apikey': c.key, 'Authorization': 'Bearer ' + c.key, 'Content-Type': 'application/json' };
  }

  async function cloudPull() {
    const c = cloudCfg();
    const res = await fetch(apiBase() + '/rest/v1/attempts?select=id,qid,answer,grade,ts&limit=20000',
      { headers: hdr(c) });
    if (!res.ok) {
      if (res.status === 404) throw new Error('404：URL 填错，或表 attempts 还没建（见配置说明第 2 步）');
      if (res.status === 401 || res.status === 403) throw new Error('key 不对或权限不足（要用 anon / publishable key）');
      throw new Error('拉取失败 HTTP ' + res.status);
    }
    let rows;
    try {
      rows = await res.json();
    } catch (e) {
      throw new Error('返回的不是 JSON：URL 要填 https://xxx.supabase.co 这种项目地址');
    }
    const seen = new Set(S.attempts.map(a => a.id));
    let add = 0;
    rows.forEach(r => {
      if (!r || !r.id || seen.has(r.id)) return;
      S.attempts.push({ id: r.id, qid: r.qid, answer: r.answer, grade: r.grade, ts: r.ts });
      seen.add(r.id); add++;
    });
    if (add) save();
    return { add: add, remote: rows.length };
  }

  async function cloudPush(list) {
    if (!list.length) return;
    const c = cloudCfg();
    const body = list.map(a => ({ id: a.id, qid: a.qid, answer: a.answer, grade: a.grade, ts: a.ts }));
    const res = await fetch(apiBase() + '/rest/v1/attempts', {
      method: 'POST',
      headers: Object.assign(hdr(c), { 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error('上传失败 HTTP ' + res.status + ' ' + t.slice(0, 90));
    }
  }

  let syncing = false;
  async function syncAll(quiet) {
    if (!cloudReady()) { if (!quiet) alert('先填 URL 和 key 并保存'); return; }
    if (syncing) return;
    syncing = true;
    try {
      if (!quiet) setStatus('同步中…');
      const r = await cloudPull();
      await cloudPush(S.attempts);

      // 疑问笔记单独一张表，失败不影响作答记录
      let nAdd = 0, nErr = '';
      try {
        nAdd = await notesPull();
        await notesPush();
      } catch (e) {
        nErr = /404/.test(e.message) ? 'notes 表还没建（见配置说明）' : e.message;
      }

      saveCfg(Object.assign(cloudCfg(), { lastSync: Date.now(), remote: r.remote }));
      setStatus('同步完成：云端 ' + r.remote + ' 条 · 本机 ' + S.attempts.length + ' 条' +
        (r.add ? '（新增 ' + r.add + '）' : '（无新增）') +
        (nErr ? '｜疑问同步失败：' + nErr : (nAdd ? '｜疑问 +' + nAdd : '')));
      if (r.add > 0 || nAdd > 0) route();   // 真有新数据才重绘，避免把状态刷掉
    } catch (e) {
      setStatus('同步失败：' + e.message);
    } finally {
      syncing = false;
    }
  }

  /* ---------------- 答题 ---------------- */
  function pickQuestions() {
    const mode = ($('input[name=mode]:checked') || {}).value || 'random';
    const types = [...document.querySelectorAll('input[name=type]:checked')].map(e => e.value);
    const topics = [...document.querySelectorAll('input[name=topic]:checked')].map(e => e.value);
    let count = parseInt($('#count').value, 10) || 10;

    let list = BANK.slice();
    if (types.length) list = list.filter(q => types.includes(q.qtype));
    if (topics.length) list = list.filter(q => topics.includes(q.topic));
    // 已经答对的（蓝点）暂时不再出，避免重复消耗时间；错题池除外
    if (mode !== 'wrong') list = list.filter(q => qLevel(q.id) !== 'blue');
    if (mode === 'wrong') list = list.filter(q => { const st = qState(q.id); return st.last && st.last.grade < 2; });
    if (mode === 'review') {
      list.sort((a, b) => {
        const sa = qState(a.id), sb = qState(b.id);
        const ta = sa.last ? sa.last.ts : 0, tb = sb.last ? sb.last.ts : 0;
        return ta - tb;
      });
    } else if (mode === 'random') {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
    }
    return list.slice(0, count);
  }

  function startSession(queue) {
    if (!queue.length) { alert('这个范围里没有题'); return; }
    session = { queue, pos: 0 };
    go('quiz');
  }

  function viewQuiz() {
    if (!session || session.pos >= session.queue.length) {
      return '<div class="card"><h1>这一轮结束了</h1><p class="muted">记录已保存。</p>' +
        '<div class="row" style="margin-top:14px"><a class="btn primary" href="#pick">再来一轮</a>' +
        '<a class="btn" href="#wrong">看错题</a></div></div>';
    }
    cur = session.queue[session.pos];
    const idx = session.pos + 1, total = session.queue.length;
    return '<div class="progress"><div class="phead"><span><b>' + idx + '</b> / ' + total + '</span>' +
      '<span>' + esc(cur.topic) + '</span></div>' +
      '<div class="track"><i style="width:' + (idx / total * 100) + '%"></i></div></div>' +
      '<div class="card"><div class="meta">' +
      '<span class="chip t">' + QT[cur.qtype] + '</span>' +
      '<span class="chip">' + esc(cur.stage_label || '') + '</span>' +
      '<span class="chip">大纲 ' + esc(cur.outline_ref || '') + '</span>' +
      (notesOf(cur.id).length ? '<span class="chip">疑问 ' + notesOf(cur.id).length + '</span>' : '') +
      '</div>' +
      '<div class="stem">' + cur.stem_html + '</div>' +
      '<textarea id="ta" placeholder="写下你的答案（写多少算多少，写完对答案自评）"></textarea>' +
      '<div class="grade" style="margin-top:10px"><button class="btn primary block" id="reveal">看参考答案</button></div>' +
      '<div id="ref" class="ref hidden"></div>' +
      '<div id="gbox" class="grade hidden"><div class="muted" style="margin-bottom:8px">对照答案，给自己判一下：</div>' +
      '<div class="row"><button class="btn bad" data-g="0">错</button>' +
      '<button class="btn mid" data-g="1">半对</button>' +
      '<button class="btn good" data-g="2">对</button></div></div></div>';
  }

  function mountQuiz() {
    if (!session || session.pos >= session.queue.length) return;
    const key = 'draft.' + cur.id;
    const ta = $('#ta');
    ta.value = localStorage.getItem(key) || '';
    ta.addEventListener('input', () => localStorage.setItem(key, ta.value));
    $('#reveal').addEventListener('click', () => {
      $('#ref').innerHTML = '<div class="label">参考答案</div>' + cur.answer_html;
      $('#ref').classList.remove('hidden');
      $('#reveal').classList.add('hidden');
      $('#gbox').classList.remove('hidden');
    });
    document.querySelectorAll('#gbox [data-g]').forEach(b => {
      b.addEventListener('click', () => {
        const grade = parseInt(b.dataset.g, 10);
        const rec = { id: uid(), qid: cur.id, answer: ta.value, grade: grade, ts: Date.now() };
        S.attempts.push(rec);
        save();
        if (cloudReady()) cloudPush([rec]).catch(() => { });   // 后台补传，失败不影响本机
        localStorage.removeItem(key);
        session.pos++;
        go('quiz');
      });
    });
  }

  /* ---------------- 导入导出 ---------------- */
  function exportData() {
    const payload = { app: 'cquiz', version: 1, exportedAt: new Date().toISOString(), attempts: S.attempts };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cquiz-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function importData(file) {
    const r = new FileReader();
    r.onload = () => {
      let d;
      try { d = JSON.parse(r.result); } catch (e) { alert('不是合法的 JSON'); return; }
      const incoming = (d && d.attempts) || [];
      const seen = new Set(S.attempts.map(a => a.id));
      let add = 0;
      incoming.forEach(a => {
        if (!a || !a.id || seen.has(a.id)) return;
        if (!qById(a.qid)) return;      // 本机题库里没有这道题，跳过
        S.attempts.push(a); seen.add(a.id); add++;
      });
      save();
      alert('合并完成：新增 ' + add + ' 条记录（重复的已跳过）');
      location.hash = '#home';
    };
    r.readAsText(file);
  }

  /* ---------------- 疑问小窗 ---------------- */
  const NK = 'cquiz.notes.v1';
  function notesAll() {
    let o = {};
    try { o = JSON.parse(localStorage.getItem(NK)) || {}; } catch (e) { o = {}; }
    // 老数据没有 id，补一个，方便云同步去重
    let changed = false;
    Object.keys(o).forEach(qid => {
      (o[qid] || []).forEach(n => { if (!n.id) { n.id = uid(); changed = true; } });
    });
    if (changed) notesSave(o);
    return o;
  }
  function notesSave(o) { localStorage.setItem(NK, JSON.stringify(o)); }
  function notesOf(qid) { return notesAll()[qid] || []; }
  function addNote(qid, text) {
    const o = notesAll();
    const n = { id: uid(), ts: Date.now(), text: text };
    (o[qid] = o[qid] || []).push(n);
    notesSave(o);
    return { id: n.id, qid: qid, text: n.text, ts: n.ts };
  }
  function allNotesFlat() {
    const o = notesAll(), out = [];
    Object.keys(o).forEach(qid => (o[qid] || []).forEach(n => out.push({ id: n.id, qid: qid, text: n.text, ts: n.ts })));
    return out;
  }
  async function notesPull() {
    const res = await fetch(apiBase() + '/rest/v1/notes?select=id,qid,text,ts&limit=20000',
      { headers: hdr(cloudCfg()) });
    if (!res.ok) throw new Error('notes 拉取 ' + res.status);
    const rows = await res.json();
    const o = notesAll();
    let add = 0;
    rows.forEach(r => {
      if (!r || !r.id) return;
      if (deletedIds().has(r.id)) return;          // 本地删过的不再拉回来
      const list = (o[r.qid] = o[r.qid] || []);
      if (list.some(n => n.id === r.id)) return;
      list.push({ id: r.id, ts: r.ts, text: r.text });
      add++;
    });
    if (add) notesSave(o);
    return add;
  }
  async function notesPush(list) {
    const del = deletedIds();
    const payload = (list || allNotesFlat()).filter(n => !del.has(n.id));
    if (!payload.length) return;
    const res = await fetch(apiBase() + '/rest/v1/notes', {
      method: 'POST',
      headers: Object.assign(hdr(cloudCfg()), { 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('notes 上传 ' + res.status);
  }
  const DELK = 'cquiz.notes.deleted.v1';
  function deletedIds() {
    try { return new Set(JSON.parse(localStorage.getItem(DELK)) || []); } catch (e) { return new Set(); }
  }
  function markDeleted(id) {
    const s = deletedIds();
    s.add(id);
    localStorage.setItem(DELK, JSON.stringify([...s]));
  }
  function deleteNote(qid, id) {
    const o = notesAll();
    o[qid] = (o[qid] || []).filter(n => n.id !== id);
    if (!o[qid].length) delete o[qid];
    notesSave(o);
    markDeleted(id);                               // 本地留墓碑，云端下次也拉不回来
    if (cloudReady()) {
      fetch(apiBase() + '/rest/v1/notes?id=eq.' + encodeURIComponent(id),
        { method: 'DELETE', headers: hdr(cloudCfg()) }).catch(() => { });
    }
  }
  function currentQid() {
    if (session && session.pos < session.queue.length) return session.queue[session.pos].id;
    return '_general';
  }

  function refreshNotePanel() {
    const qid = currentQid();
    const q = qById(qid);
    const where = document.getElementById('nwhere');
    if (where) {
      where.textContent = q
        ? '疑问 · ' + q.id + (q.outline_ref ? ' · 大纲 ' + q.outline_ref : '')
        : '疑问 · 通用';
    }
    const list = notesOf(qid).slice(-6).reverse();
    const box = document.getElementById('nlist');
    if (box) {
      box.innerHTML = list.length
        ? list.map(n => '<div class="note-item">' + esc(n.text) +
          '<span class="t">' + new Date(n.ts).toLocaleString() + '</span></div>').join('')
        : '<p class="muted" style="margin:0 0 8px">这题还没有疑问记录。</p>';
    }
  }

  function mountNote() {
    const fab = document.createElement('button');
    fab.className = 'fab';
    fab.id = 'fab';
    fab.type = 'button';
    fab.title = '记一笔疑问';
    fab.textContent = '?';

    const panel = document.createElement('div');
    panel.className = 'note-panel';
    panel.id = 'npanel';
    panel.innerHTML =
      '<div class="note-head"><b id="nwhere">记一笔疑问</b>' +
      '<button class="note-x" id="nclose" type="button">收起</button></div>' +
      '<div class="note-list" id="nlist"></div>' +
      '<textarea id="ntext" placeholder="哪里没想明白？一句话就行"></textarea>' +
      '<div style="margin-top:8px"><button class="btn primary block" id="nsave" type="button">保存</button></div>';

    document.body.appendChild(fab);
    document.body.appendChild(panel);

    const openPanel = () => {
      refreshNotePanel();
      panel.classList.add('open');
      setTimeout(() => { const t = document.getElementById('ntext'); if (t) t.focus(); }, 180);
    };
    const closePanel = () => panel.classList.remove('open');

    fab.addEventListener('click', () => {
      if (panel.classList.contains('open')) closePanel(); else openPanel();
    });
    document.getElementById('nclose').addEventListener('click', closePanel);
    document.getElementById('nsave').addEventListener('click', () => {
      const ta = document.getElementById('ntext');
      const t = (ta.value || '').trim();
      if (!t) { closePanel(); return; }
      const rec = addNote(currentQid(), t);
      if (cloudReady()) notesPush([rec]).catch(() => { });   // 后台补传
      ta.value = '';
      refreshNotePanel();
      closePanel();               // 记完自动收回小窗
    });
    document.getElementById('ntext').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        document.getElementById('nsave').click();
      }
    });
    document.addEventListener('click', e => {
      if (!panel.classList.contains('open')) return;
      if (panel.contains(e.target) || e.target === fab) return;
      closePanel();
    });
  }

  /* ---------------- 路由 ---------------- */
  const VIEWS = { home: viewHome, pick: viewPick, wrong: viewWrong, hist: viewHist,
                  notes: viewNotes, more: viewMore, quiz: viewQuiz };

  function route() {
    // hash 里可能带查询串（#pick?mode=wrong），页面名要先把 ? 之后切掉
    const raw = (location.hash || '#home').slice(1);
    const name = raw.split('?')[0];
    const v = VIEWS[name] || viewHome;
    app().innerHTML = v();
    document.querySelectorAll('.tabbar a').forEach(a => {
      a.classList.toggle('on', a.dataset.tab === name);
    });
    if (name === 'wrong') {
      const d = $('#drill');
      if (d) d.addEventListener('click', () => { location.hash = '#pick?mode=wrong'; });
    }
    if (name === 'hist') {
      document.querySelectorAll('.day-head').forEach(h => {
        h.addEventListener('click', () => {
          const d = h.parentElement;
          d.classList.toggle('open');
          const k = d.dataset.day;
          if (d.classList.contains('open')) openDays.add(k); else openDays.delete(k);
        });
      });
    }
    if (name === 'notes') {
      document.querySelectorAll('.del').forEach(b => {
        b.addEventListener('click', () => {
          const parts = (b.dataset.del || '').split('|');
          if (!confirm('删掉这条疑问？')) return;
          deleteNote(parts[0], parts[1]);
          route();
        });
      });
    }
    if (name === 'home') {
      document.querySelectorAll('[data-mode=wrong]').forEach(a =>
        a.addEventListener('click', () => { location.hash = '#pick?mode=wrong'; }));
    }
    if (name === 'pick') {
      $('#go').addEventListener('click', () => startSession(pickQuestions()));
      document.querySelectorAll('.acc-head').forEach(h => {
        h.addEventListener('click', () => {
          const acc = h.parentElement;
          acc.classList.toggle('open');
          const k = acc.dataset.ch;
          if (acc.classList.contains('open')) openCh.add(k); else openCh.delete(k);
        });
      });
      const m = new URLSearchParams((location.hash.split('?')[1]) || '');
      if (m.get('mode') === 'wrong') {
        const r = document.querySelector('input[name=mode][value=wrong]');
        if (r) r.checked = true;
      }
    }
    if (name === 'quiz') mountQuiz();
    if (name === 'more') {
      $('#csave').addEventListener('click', async () => {
        const url = normUrl($('#curl').value);
        const key = ($('#ckey').value || '').trim();
        if (!url || !key) { alert('两项都要填'); return; }
        saveCfg({ url: url, key: key, lastSync: 0 });
        setStatus('测试连接中…');
        await syncAll(false);
      });
      $('#csync').addEventListener('click', () => syncAll(false));
      $('#exp').addEventListener('click', exportData);
      $('#imp').addEventListener('click', () => $('#file').click());
      $('#file').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); });
      $('#clr').addEventListener('click', () => {
        if (confirm('清空本机所有作答记录？此操作不可撤销，建议先导出。')) {
          S = { attempts: [] }; save(); location.hash = '#home';
        }
      });
    }
    window.scrollTo(0, 0);
    // 切到任何页面都顺手对一次账（20 秒内不重复）
    if (cloudReady() && !syncing && (Date.now() - (cloudCfg().lastSync || 0)) > 20000) {
      syncAll(true);
    }
  }

  function boot() {
    document.getElementById('root').innerHTML = '<div class="wrap" id="app"></div>' + nav();
    window.addEventListener('hashchange', route);
    mountNote();
    // 自检钩子：?selftest=1 进答题卡（可跟题号，如 ?selftest=9）
    const st = location.search.match(/[?&]selftest=(\d+)/);
    if (st && BANK.length) {
      const i = Math.max(0, Math.min(parseInt(st[1], 10) - 1, BANK.length - 1));
      session = { queue: BANK.slice(i, i + 3), pos: 0 };
      location.hash = '#quiz';
    }
    route();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => { });
    }
    // 配了云同步就在启动时悄悄对一次账
    if (cloudReady()) setTimeout(() => syncAll(true), 600);
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
